<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orthogonal — Editor</title>
<link rel="stylesheet" href="styles.css?v=6">
<style>
body{background:#0f0f10;color:#e8e8ea}
body,html{height:100%}
:root{--dline:#262628;--dmuted:#9a9aa0;--dcard:#161617;--dchip:#1d1d1f}
.top{display:flex;align-items:center;gap:14px;padding:0 18px;height:58px;border-bottom:1px solid var(--dline)}
.top .mark{width:22px;height:22px;border-radius:6px;background:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;color:#fff}
.top .crumb{font-size:13px;color:#e8e8ea;font-weight:600;display:flex;align-items:center;gap:8px}
.top .crumb span{color:var(--dmuted);font-weight:400}
.pill-ready{background:#f0c93e;color:#171717;font-size:11px;font-weight:700;border-radius:999px;padding:3px 10px}
.top .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.seg{display:flex;background:var(--dchip);border:1px solid var(--dline);border-radius:9px;padding:3px;gap:2px}
.seg button{border:none;background:none;color:var(--dmuted);font-size:12px;font-weight:600;padding:5px 14px;border-radius:7px;cursor:pointer}
.seg button.on{background:#fff;color:#171717}
.btn-cont{background:var(--brand);color:#fff;border:none;border-radius:9px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer}
.wrap{display:grid;grid-template-columns:300px 1fr 320px;height:calc(100vh - 58px)}
.steps{border-right:1px solid var(--dline);overflow-y:auto}
.step{display:flex;gap:12px;padding:14px 18px;border-bottom:1px solid var(--dline);cursor:pointer;align-items:flex-start}
.step .num{width:26px;height:26px;flex:none;border-radius:8px;background:var(--dchip);color:var(--dmuted);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.step .tt{font-size:13px;font-weight:600;line-height:1.3}
.step .ss{font-size:11px;color:var(--dmuted);margin-top:3px}
.step.on{background:#1a1a1c}
.step.on .num{background:var(--brand);color:#fff}
.center{overflow-y:auto;padding:34px 34px 20px;display:flex;flex-direction:column;align-items:center}
.browser{width:100%;max-width:820px;border:1px solid var(--dline);border-radius:14px;overflow:hidden;background:#fff;transition:max-width .25s}
body.mobile .browser{max-width:390px}
.bchrome{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid #ececee;background:#fafafa}
.bchrome .d{width:10px;height:10px;border-radius:50%}
.bchrome .url{flex:1;background:#fff;border:1px solid #ececee;border-radius:8px;font-size:11px;color:#8a8a90;padding:5px 12px;text-align:center}
.bpage{background:var(--brand);color:#fff;min-height:480px;padding:34px 40px;display:flex;flex-direction:column}
.xp-row{display:flex;align-items:center;gap:10px;margin-bottom:34px}
.xp-row .xpbar{flex:1;height:6px;border-radius:99px;background:rgba(255,255,255,.35);overflow:hidden}
.xp-row .xpbar i{display:block;height:100%;background:rgba(0,0,0,.55);border-radius:99px}
.xp-row .xp-t{font-size:12px;font-weight:700}
.lvl{background:rgba(0,0,0,.4);border-radius:999px;padding:4px 12px;font-size:11px;font-weight:700}
.bpage .stepno{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.75;font-weight:700}
.bpage h2{font-size:40px;margin:14px 0 10px;line-height:1.05}
.bpage .bsub{font-size:15px;opacity:.85;margin-bottom:34px}
.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.fld label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.75;font-weight:700;margin-bottom:6px}
.fld .v{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);border-radius:10px;padding:12px 14px;font-size:14px;font-weight:600}
.opts{display:flex;flex-direction:column;gap:10px;max-width:420px}
.opt{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);border-radius:10px;padding:13px 16px;font-size:14px;font-weight:600}
.opt.picked{background:rgba(0,0,0,.4);border-color:rgba(0,0,0,.5)}
.unlock{margin-top:auto;display:flex;align-items:center;gap:8px;font-size:12px;opacity:.85;padding-top:30px}
.unlock b{display:block;font-size:13px}
.bnav{display:flex;align-items:center;gap:14px;margin-top:18px}
.bnav .bback{font-size:13px;font-weight:600;opacity:.8}
.bnav .bnext{margin-left:auto;background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:12px 22px;font-size:14px;font-weight:700}
.caption{margin-top:14px;font-size:11px;color:var(--dmuted)}
.side{border-left:1px solid var(--dline);display:flex;flex-direction:column;overflow:hidden}
.side .tabs{display:flex;border-bottom:1px solid var(--dline)}
.side .tabs button{flex:1;border:none;background:none;color:var(--dmuted);font-size:13px;font-weight:600;padding:14px 0;cursor:pointer;border-bottom:2px solid transparent}
.side .tabs button.on{color:#e8e8ea;border-bottom-color:#fff;background:#161617}
.side .body{flex:1;overflow-y:auto;padding:14px}
.search{width:100%;background:var(--dchip);border:1px solid var(--dline);border-radius:9px;color:#e8e8ea;padding:9px 12px;font-size:12px;margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--dline);background:var(--dchip);color:var(--dmuted);font-size:11px;font-weight:600;border-radius:8px;padding:5px 10px;cursor:pointer}
.chip.on{background:#f0c93e;border-color:#f0c93e;color:#171717}
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acard{background:var(--dchip);border:1px solid var(--dline);border-radius:10px;overflow:hidden}
.acard .thumb{height:90px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.acard .meta{padding:8px 10px;border-top:1px solid var(--dline)}
.acard .meta b{display:block;font-size:11px}
.acard .meta span{font-size:10px;color:var(--dmuted)}
.dctl{margin-bottom:18px}
.dctl label{display:block;font-size:11px;font-weight:700;color:var(--dmuted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.dctl .swrow{display:flex;gap:8px;align-items:center}
.dctl input[type=color]{width:44px;height:30px;border:1px solid var(--dline);border-radius:8px;background:none;cursor:pointer;padding:2px}
.dctl select,.dctl input[type=text]{width:100%;background:var(--dchip);border:1px solid var(--dline);border-radius:8px;color:#e8e8ea;padding:8px 10px;font-size:12px}
.dctl input[type=range]{width:100%}
.dctl .val{font-size:12px;color:var(--dmuted);margin-left:auto}
.side .foot{padding:12px 16px;border-top:1px solid var(--dline);font-size:11px;color:var(--dmuted);line-height:1.5}
@media(max-width:1100px){.wrap{grid-template-columns:240px 1fr 260px}}
@media(max-width:880px){.wrap{grid-template-columns:1fr}.steps,.side{display:none}}
</style>
</head>
<body>
<div class="top">
  <div class="mark" id="mk">M</div>
  <div class="crumb">Orthogonal <span>/</span> <span id="proj">Onboarding</span></div>
  <span class="pill-ready">Ready</span>
  <div class="right">
    <div class="seg">
      <button id="seg-d" class="on" onclick="setMode('d')">Desktop</button>
      <button id="seg-m" onclick="setMode('m')">Mobile</button>
    </div>
    <button class="btn-cont" onclick="location.href='dashboard.html'">Continue →</button>
  </div>
</div>
<div class="wrap">
  <div class="steps" id="steps"></div>
  <div class="center">
    <div class="browser">
      <div class="bchrome">
        <span class="d" style="background:#ff5c39"></span><span class="d" style="background:#ffb31f"></span><span class="d" style="background:#0e9f6e"></span>
        <div class="url" id="url"></div>
      </div>
      <div class="bpage" id="bpage"></div>
    </div>
    <div class="caption" id="cap"></div>
  </div>
  <div class="side">
    <div class="tabs">
      <button class="on" onclick="sideTab(this,'assets')">Assets</button>
      <button onclick="sideTab(this,'design')">Design</button>
    </div>
    <div class="body" id="side-body"></div>
    <div class="foot">Select an asset to see where it was found. Drag one onto the preview to use it in the current step.</div>
  </div>
</div>
<script src="state.js?v=3"></script>
<script>
const S=OB.get();
const B=S.brand||{primary:'#2b5cff',accent:'#ff5c39',company:'Acme',host:'acme.com',initials:'A',style:'minimal'};
document.documentElement.style.setProperty('--brand',B.primary);
let primary=B.primary, accent=B.accent||'#ff5c39', radius=10;
document.getElementById('mk').textContent=(B.initials||'O').slice(0,1);
document.getElementById('mk').style.background=primary;
document.getElementById('proj').textContent=B.company+' onboarding';
document.getElementById('url').textContent='app.'+B.host+'/welcome';

const STEPS=[
  {t:'Welcome to '+B.company,s:'Welcome screen · +20 XP',k:'welcome'},
  ...OB.COURSES.slice(0,4).map(c=>({t:c.title,s:c.game+' · +20 XP',k:'course',c})),
  {t:"You're all set.",s:'Completion · +20 XP',k:'done'},
];
let cur=0;
function renderSteps(){
  document.getElementById('steps').innerHTML=STEPS.map((s,i)=>
    `<div class="step ${i===cur?'on':''}" onclick="pick(${i})"><span class="num">${i+1}</span><div><div class="tt">${s.t}</div><div class="ss">${s.s}</div></div></div>`).join('');
}
function pick(i){cur=i;renderSteps();renderPage();}
function xpRow(n){
  const pct=Math.round(n/STEPS.length*100);
  return `<div class="xp-row"><div class="xpbar"><i style="width:${pct}%"></i></div><span class="xp-t">${n*20} XP</span><span class="lvl">Lvl 1 · Rookie</span></div>`;
}
function renderPage(){
  const s=STEPS[cur],el=document.getElementById('bpage');
  el.style.background=primary;
  let inner=xpRow(cur+1)+`<div class="stepno">Step ${cur+1} of ${STEPS.length}</div><h2>${s.t}</h2>`;
  if(s.k==='welcome'){
    inner+=`<div class="bsub">A few quick questions to unlock your first mission.</div>
    <div class="fields"><div class="fld"><label>Name</label><div class="v">${(S.manager?.name||'New hire').split(' ')[0]}</div></div>
    <div class="fld"><label>Team</label><div class="v">Engineering ▾</div></div>
    <div class="fld"><label>Start date</label><div class="v">Today</div></div></div>
    <div class="unlock"><span>UNLOCKS</span><b>World access</b></div>`;
  } else if(s.k==='course'){
    const c=s.c;
    inner+=`<div class="bsub">${c.desc||'Prove what you picked up in '+c.building+'.'}</div>
    <div class="opts"><div class="opt">${c.lessons[0]||'Key concept'}</div><div class="opt picked">${c.lessons[1]||'Core rule'}</div><div class="opt">${c.lessons[2]||'Wrap-up'}</div></div>
    <div class="unlock"><span>UNLOCKS</span><b>${c.building} badge</b></div>`;
  } else {
    inner+=`<div class="bsub">Onboarding complete — the whole map is open.</div>
    <div class="fields"><div class="fld"><label>Coins earned</label><div class="v">120</div></div>
    <div class="fld"><label>Buildings cleared</label><div class="v">${STEPS.length-2}</div></div>
    <div class="fld"><label>Rank</label><div class="v">Rookie</div></div></div>
    <div class="unlock"><span>UNLOCKS</span><b>Full world + rewards</b></div>`;
  }
  inner+=`<div class="bnav"><span class="bback">Back</span><span class="bnext">Continue · +20 XP</span></div>`;
  el.innerHTML=inner;
  document.getElementById('cap').textContent=`Step ${cur+1} of ${STEPS.length} · click any text to edit · design controls on the right`;
}
function setMode(m){
  document.body.classList.toggle('mobile',m==='m');
  document.getElementById('seg-d').classList.toggle('on',m==='d');
  document.getElementById('seg-m').classList.toggle('on',m==='m');
}
function sideTab(btn,tab){
  document.querySelectorAll('.side .tabs button').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  tab==='assets'?renderAssets():renderDesign();
}
function renderAssets(){
  const el=document.getElementById('side-body');
  const assets=[
    ['Logo mark',B.initials||'O','SVG · 24×24',`background:${primary};color:#fff`,'brand'],
    ['Wordmark dark',B.company,'SVG · on dark','background:#171719;color:#fff','brand'],
    ['Primary',primary,'color · primary',`background:${primary};color:#fff`,'colors'],
    ['Accent',accent,'color · accent',`background:${accent};color:#fff`,'colors'],
    ['Hero image','16:9','JPG · 1600×900',`background:linear-gradient(135deg,${primary},${accent});color:#fff`,'brand'],
    ['Favicon',(B.initials||'O').slice(0,1),'PNG · 32×32',`background:${primary};color:#fff`,'icons'],
    ['Body font','Aa — '+B.style,'type · sans','background:#1d1d1f;color:#e8e8ea','type'],
    ['Copy deck','Welcome line','TXT · scraped','background:#1d1d1f;color:#9a9aa0','copy'],
  ];
  el.innerHTML=`<input class="search" placeholder="Search ${assets.length} assets from ${B.host}">
    <div class="chips" id="chips"></div><div class="agrid" id="ag"></div>`;
  const cats=['All','Brand','Colors','Type','Icons','Copy'];
  function draw(cat){
    document.getElementById('ag').innerHTML=assets.filter(a=>cat==='All'||a[4]===cat.toLowerCase()).map(a=>
      `<div class="acard"><div class="thumb" style="${a[3]}">${a[1]}</div><div class="meta"><b>${a[0]}</b><span>${a[2]}</span></div></div>`).join('');
    document.getElementById('chips').innerHTML=cats.map(c=>
      `<button class="chip ${c===cat?'on':''}" onclick="window._ac('${c}')">${c}${c==='All'?' '+assets.length:''}</button>`).join('');
  }
  window._ac=draw;draw('All');
}
function renderDesign(){
  document.getElementById('side-body').innerHTML=`
    <div class="dctl"><label>Primary color</label><div class="swrow"><input type="color" id="dc-p" value="${primary}"><span class="val">${primary}</span></div></div>
    <div class="dctl"><label>Accent color</label><div class="swrow"><input type="color" id="dc-a" value="${accent}"><span class="val">${accent}</span></div></div>
    <div class="dctl"><label>Corner radius</label><div class="swrow"><input type="range" id="dc-r" min="0" max="20" value="${radius}"><span class="val" id="dc-rv">${radius}px</span></div></div>
    <div class="dctl"><label>Headline style</label><select><option>Bold editorial</option><option>Clean sans</option><option>Friendly rounded</option></select></div>`;
  document.getElementById('dc-p').oninput=e=>{primary=e.target.value;applyBrand();e.target.nextElementSibling.textContent=primary;};
  document.getElementById('dc-a').oninput=e=>{accent=e.target.value;applyBrand();e.target.nextElementSibling.textContent=accent;};
  document.getElementById('dc-r').oninput=e=>{radius=+e.target.value;applyBrand();document.getElementById('dc-rv').textContent=radius+'px';};
}
function applyBrand(){
  document.documentElement.style.setProperty('--brand',primary);
  document.getElementById('mk').style.background=primary;
  document.getElementById('bpage').style.background=primary;
  document.querySelectorAll('.step.on .num').forEach(n=>n.style.background=primary);
  const s=OB.get();s.brand=Object.assign({},s.brand,{primary,accent});OB.save(s);
}
renderSteps();renderPage();renderAssets();
document.querySelectorAll('.svgic').forEach(e=>e.outerHTML=OB.icon(e.dataset.ic));
</script>
</body>
</html>
