<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orthogonal — Company brain</title>
<link rel="stylesheet" href="styles.css?v=6">
<style>
body{background:#0d0d10;color:#e8e8ea;overflow:hidden}
.hdr{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:14px;padding:16px 20px;z-index:10}
.back{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:#c8c8ce;text-decoration:none;background:#16161a;border:1px solid #26262c;border-radius:9px;padding:8px 14px}
.back:hover{color:#fff;border-color:#3a3a42}
.hdr .t{font-size:15px;font-weight:700}
.hdr .m{font-size:12px;color:#8a8a94}
.legend{position:absolute;left:20px;bottom:20px;background:#16161acc;border:1px solid #26262c;border-radius:12px;padding:12px 16px;z-index:10;backdrop-filter:blur(6px)}
.legend .row{display:flex;align-items:center;gap:9px;font-size:12px;color:#c8c8ce;padding:3px 0}
.legend .dot{width:10px;height:10px;border-radius:50%}
.legend .cap{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#8a8a94;font-weight:700;margin-bottom:6px}
.meta{position:absolute;right:20px;bottom:20px;font-size:11px;color:#8a8a94;z-index:10;text-align:right;line-height:1.7}
canvas{display:block}
</style>
</head>
<body>
<div class="hdr">
  <a class="back" href="dashboard.html?tab=tools"><i class="svgic" data-ic="back"></i> Back</a>
  <div><div class="t" id="bt">Company brain</div><div class="m" id="bm">knowledge graph</div></div>
</div>
<canvas id="g"></canvas>
<div class="legend" id="legend"></div>
<div class="meta" id="meta"></div>
<script src="state.js?v=3"></script>
<script>
const S=OB.get();
const B=S.brand||{company:'Acme',host:'acme.com'};
document.getElementById('bt').textContent=B.company+' brain';
const cv=document.getElementById('g'),ctx=cv.getContext('2d');
let W,H;
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight;}
addEventListener('resize',size);size();

// seeded rng for a stable layout
let seed=42;
function rnd(){seed=(seed*1103515245+12345)%2147483648;return seed/2147483648;}

const CLUSTERS=[
  {name:'People',color:'#5b8cff',nodes:['Priya — VP Eng','Marco — Deploy','Aisha — Design','Dana — Manager','Jon — Support','Lena — Sales','Raj — Data','Maya — HR'],x:.30,y:.30},
  {name:'Glossary',color:'#f5a623',nodes:['LGTM','EOD','The Vault','RFC','DM','On-call','LGTM +2','Postmortem'],x:.72,y:.28},
  {name:'Tools',color:'#34c98e',nodes:['GitHub','Slack','Jira','Notion','1Password','Figma','Linear','Datadog'],x:.74,y:.70},
  {name:'Rituals',color:'#b07df0',nodes:['Async standup','Demo Day','Sprint kickoff','Retro','1:1s','All-hands'],x:.28,y:.72},
  {name:'Docs & History',color:'#f06ba8',nodes:['Pivot 2023','"Nimbus" old name','Onboarding wiki','Architecture RFCs','Runbooks'],x:.50,y:.52},
];
const nodes=[],edges=[];
// hub
const hub={x:.5,y:.46,r:26,label:B.company,color:'#ffffff',hub:true};
CLUSTERS.forEach((c,ci)=>{
  const cx=c.x,cy=c.y;
  const center={x:cx,y:cy,r:15,label:c.name,color:c.color,cluster:ci};
  nodes.push(center);
  edges.push([hub,center]);
  c.nodes.forEach((n,ni)=>{
    const a=rnd()*Math.PI*2, d=.055+rnd()*.115;
    const p={x:cx+Math.cos(a)*d,y:cy+Math.sin(a)*d*.8,r:3.5+rnd()*4,label:n,color:c.color,cluster:ci,small:true};
    nodes.push(p);
    edges.push([center,p]);
    if(rnd()<.5){const q=nodes[1+ci*0+rnd()*nodes.length|0];if(q&&q!==p)edges.push([p,q]);}
  });
});
// a few cross-cluster edges
for(let i=0;i<14;i++){const a=nodes[1+(rnd()*nodes.length-1|0)],b=nodes[1+(rnd()*nodes.length-1|0)];if(a!==b)edges.push([a,b]);}
nodes.push(hub);

function pt(n){return{x:n.x*W,y:n.y*H};}
function draw(){
  ctx.clearRect(0,0,W,H);
  edges.forEach(([a,b])=>{
    const A=pt(a),P=pt(b);
    ctx.strokeStyle=a.color+'28';
    ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(P.x,P.y);ctx.stroke();
  });
  nodes.forEach(n=>{
    const P=pt(n);
    ctx.beginPath();ctx.arc(P.x,P.y,n.r,0,7);
    ctx.fillStyle=n.color;ctx.globalAlpha=n.small?.85:1;ctx.fill();ctx.globalAlpha=1;
    if(!n.small){
      ctx.fillStyle='#fff';ctx.font='700 13px Inter,system-ui';ctx.textAlign='center';
      ctx.fillText(n.label,P.x,P.y-n.r-8);
    } else if(n.r>5.5){
      ctx.fillStyle='rgba(255,255,255,.55)';ctx.font='10px Inter,system-ui';ctx.textAlign='left';
      ctx.fillText(n.label,P.x+n.r+3,P.y+3);
    }
  });
}
draw();
document.getElementById('legend').innerHTML='<div class="cap">Partitions</div>'+CLUSTERS.map(c=>
  `<div class="row"><span class="dot" style="background:${c.color}"></span>${c.name} · ${c.nodes.length+1}</div>`).join('');
document.getElementById('meta').innerHTML=nodes.length+' nodes · '+edges.length+' edges<br>built from '+(Object.keys(S.tools||{}).length||'0')+' connected tools + website scrape<br><span style="opacity:.6">mock graph — real graph from Gephi when built</span>';
document.querySelectorAll('.svgic').forEach(e=>e.outerHTML=OB.icon(e.dataset.ic));
</script>
</body>
</html>
